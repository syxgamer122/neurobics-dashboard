<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T-Rex Runner</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #111827;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: "Courier New", monospace;
        overflow: hidden;
        user-select: none;
      }
      canvas {
        display: block;
        border-radius: 12px;
      }
      #ui {
        position: absolute;
        top: 16px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        padding: 0 24px;
        color: #10b981;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 2px;
        pointer-events: none;
      }
      #msg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #10b981;
        pointer-events: none;
      }
      #msg h2 {
        font-size: 28px;
        letter-spacing: 4px;
        margin-bottom: 8px;
      }
      #msg p {
        font-size: 13px;
        color: #6ee7b7;
        letter-spacing: 2px;
      }
      #restart {
        margin-top: 18px;
        padding: 10px 28px;
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid #10b981;
        color: #10b981;
        font-family: monospace;
        font-size: 13px;
        letter-spacing: 3px;
        border-radius: 8px;
        cursor: pointer;
        pointer-events: all;
        transition: all 0.2s;
      }
      #restart:hover {
        background: rgba(16, 185, 129, 0.3);
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <span>SCORE: <span id="score">0</span></span
      ><span>BEST: <span id="best">0</span></span>
    </div>
    <canvas id="c"></canvas>
    <div id="msg" style="display: none">
      <h2>GAME OVER</h2>
      <p>SCORE: <span id="final">0</span></p>
      <button id="restart">▶ PLAY AGAIN</button>
    </div>
    <script src="dino.js"></script>
  </body>
</html>
