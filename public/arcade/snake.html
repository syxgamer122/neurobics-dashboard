<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', monospace; overflow: hidden; user-select: none; }
  #top { display: flex; justify-content: space-between; width: 100%; max-width: 400px; padding: 0 8px 10px; color: #10b981; font-size: 13px; letter-spacing: 2px; }
  canvas { display: block; border-radius: 12px; border: 1px solid rgba(16,185,129,0.2); box-shadow: 0 0 40px rgba(16,185,129,0.1); }
  #overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; color: #10b981; background: rgba(15,23,42,0.95); border: 1px solid rgba(16,185,129,0.3); border-radius: 16px; padding: 32px 40px; box-shadow: 0 0 40px rgba(16,185,129,0.2); }
  #overlay h2 { font-size: 26px; letter-spacing: 4px; margin-bottom: 10px; text-shadow: 0 0 16px rgba(16,185,129,0.6); }
  #overlay p { font-size: 13px; color: #6ee7b7; letter-spacing: 2px; margin: 4px 0; }
  #restart { margin-top: 18px; padding: 10px 28px; background: rgba(16,185,129,0.15); border: 1px solid #10b981; color: #10b981; font-family: monospace; font-size: 13px; letter-spacing: 3px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
  #restart:hover { background: rgba(16,185,129,0.3); box-shadow: 0 0 20px rgba(16,185,129,0.4); }
  .hint { font-size: 11px !important; color: rgba(110,231,183,0.5) !important; margin-top: 8px !important; }
</style>
</head>
<body>
<div id="top"><span>SCORE: <span id="score">0</span></span><span>BEST: <span id="best">0</span></span><span>LV: <span id="lv">1</span></span></div>
<canvas id="c"></canvas>
<div id="overlay">
  <h2>SNAKE</h2>
  <p>ARROW KEYS / WASD</p>
  <p class="hint">Mobile: swipe to move</p>
  <button id="restart">▶ START</button>
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const SIZE = Math.min(Math.floor(Math.min(window.innerWidth, window.innerHeight - 80) / 20) * 20, 400);
const CELL = 20, COLS = SIZE / CELL, ROWS = SIZE / CELL;
c.width = SIZE; c.height = SIZE;

let snake, dir, nextDir, food, score, best = 0, eatCount, gameLoop, foodPulse = 0, alive = false;

function rnd(n) { return Math.floor(Math.random() * n); }

function initGame() {
  const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
  snake = [{x: cx, y: cy}, {x: cx-1, y: cy}, {x: cx-2, y: cy}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0; eatCount = 0;
  document.getElementById('score').textContent = '0';
  document.getElementById('lv').textContent = '1';
  spawnFood();
}

function spawnFood() {
  let pos;
  do { pos = {x: rnd(COLS), y: rnd(ROWS)}; }
  while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function setDir(dx, dy) {
  if (dx === -dir.x && dy === -dir.y) return;
  nextDir = {x: dx, y: dy};
}

document.addEventListener('keydown', e => {
  const map = {
    ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
    KeyW: [0,-1], KeyS: [0,1], KeyA: [-1,0], KeyD: [1,0]
  };
  if (map[e.code]) { e.preventDefault(); setDir(...map[e.code]); }
});

// Touch/swipe
let tx = 0, ty = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
}, {passive: true});

document.getElementById('restart').addEventListener('click', startGame);

function startGame() {
  initGame();
  alive = true;
  document.getElementById('overlay').style.display = 'none';
  if (gameLoop) clearInterval(gameLoop);
  const speed = 150;
  gameLoop = setInterval(tick, speed);
}

function tick() {
  dir = nextDir;
  const head = { x: (snake[0].x + dir.x + COLS) % COLS, y: (snake[0].y + dir.y + ROWS) % ROWS };

  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    alive = false;
    clearInterval(gameLoop);
    if (score > best) best = score;
    document.getElementById('best').textContent = best;
    const ov = document.getElementById('overlay');
    ov.querySelector('h2').textContent = 'GAME OVER';
    ov.querySelector('p').textContent = `SCORE: ${score}`;
    ov.querySelectorAll('p')[1].textContent = `BEST: ${best}`;
    document.getElementById('restart').textContent = '▶ PLAY AGAIN';
    ov.style.display = 'block';
    window.parent.postMessage({ type: 'GAME_OVER', score }, '*');
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    eatCount++;
    document.getElementById('score').textContent = score;
    const lv = Math.floor(eatCount / 5) + 1;
    document.getElementById('lv').textContent = lv;
    spawnFood();
    // Speed up
    if (eatCount % 5 === 0 && eatCount > 0) {
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, Math.max(80, 150 - lv * 10));
    }
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  // Background
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Grid
  ctx.strokeStyle = 'rgba(30,41,59,0.8)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(SIZE, i * CELL); ctx.stroke();
  }

  // Food with pulse
  foodPulse = (foodPulse + 0.08) % (Math.PI * 2);
  const pulse = 1 + Math.sin(foodPulse) * 0.2;
  const fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
  const fr = (CELL / 2 - 2) * pulse;
  // Glow
  const glow = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr * 2.5);
  glow.addColorStop(0, 'rgba(244,63,94,0.5)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(fx, fy, fr * 2.5, 0, Math.PI * 2); ctx.fill();
  // Food dot
  const fg = ctx.createRadialGradient(fx - 2, fy - 2, 1, fx, fy, fr);
  fg.addColorStop(0, '#fca5a5');
  fg.addColorStop(1, '#f43f5e');
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI * 2); ctx.fill();

  // Snake
  snake.forEach((seg, i) => {
    const sx = seg.x * CELL, sy = seg.y * CELL;
    const t = i / snake.length;
    const r = Math.max(2, 16 * (1 - t * 0.4));
    const alpha = 1 - t * 0.3;
    ctx.globalAlpha = alpha;

    if (i === 0) {
      // Head glow
      const hg = ctx.createRadialGradient(sx + CELL/2, sy + CELL/2, 0, sx + CELL/2, sy + CELL/2, CELL);
      hg.addColorStop(0, 'rgba(52,211,153,0.4)');
      hg.addColorStop(1, 'transparent');
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.arc(sx + CELL/2, sy + CELL/2, CELL, 0, Math.PI * 2); ctx.fill();

      // Head
      const hgrad = ctx.createLinearGradient(sx, sy, sx + CELL, sy + CELL);
      hgrad.addColorStop(0, '#34d399');
      hgrad.addColorStop(1, '#10b981');
      ctx.fillStyle = hgrad;
      ctx.beginPath();
      ctx.roundRect(sx + 1, sy + 1, CELL - 2, CELL - 2, 5);
      ctx.fill();

      // Eyes
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#0f172a';
      if (dir.x === 1) { ctx.fillRect(sx+13, sy+4, 4, 4); ctx.fillRect(sx+13, sy+12, 4, 4); }
      else if (dir.x === -1) { ctx.fillRect(sx+3, sy+4, 4, 4); ctx.fillRect(sx+3, sy+12, 4, 4); }
      else if (dir.y === -1) { ctx.fillRect(sx+4, sy+3, 4, 4); ctx.fillRect(sx+12, sy+3, 4, 4); }
      else { ctx.fillRect(sx+4, sy+13, 4, 4); ctx.fillRect(sx+12, sy+13, 4, 4); }
    } else {
      const sg = ctx.createLinearGradient(sx, sy, sx + CELL, sy + CELL);
      sg.addColorStop(0, `rgba(16,185,129,${0.9 - t * 0.3})`);
      sg.addColorStop(1, `rgba(5,150,105,${0.7 - t * 0.3})`);
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.roundRect(sx + 2, sy + 2, CELL - 4, CELL - 4, 4);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  });
}

// Initial draw
ctx.fillStyle = '#0f172a';
ctx.fillRect(0, 0, SIZE, SIZE);
</script>
</body>
</html>
