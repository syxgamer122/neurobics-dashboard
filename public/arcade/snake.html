<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: "Courier New", monospace;
        overflow: hidden;
        user-select: none;
      }
      #top {
        display: flex;
        justify-content: space-between;
        width: 100%;
        max-width: 400px;
        padding: 0 8px 10px;
        color: #10b981;
        font-size: 13px;
        letter-spacing: 2px;
      }
      canvas {
        display: block;
        border-radius: 12px;
        border: 1px solid rgba(16, 185, 129, 0.2);
        box-shadow: 0 0 40px rgba(16, 185, 129, 0.1);
      }
      #overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #10b981;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 16px;
        padding: 32px 40px;
        box-shadow: 0 0 40px rgba(16, 185, 129, 0.2);
      }
      #overlay h2 {
        font-size: 26px;
        letter-spacing: 4px;
        margin-bottom: 10px;
        text-shadow: 0 0 16px rgba(16, 185, 129, 0.6);
      }
      #overlay p {
        font-size: 13px;
        color: #6ee7b7;
        letter-spacing: 2px;
        margin: 4px 0;
      }
      #restart {
        margin-top: 18px;
        padding: 10px 28px;
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid #10b981;
        color: #10b981;
        font-family: monospace;
        font-size: 13px;
        letter-spacing: 3px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
      }
      #restart:hover {
        background: rgba(16, 185, 129, 0.3);
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
      }
      .hint {
        font-size: 11px !important;
        color: rgba(110, 231, 183, 0.5) !important;
        margin-top: 8px !important;
      }
    </style>
  </head>
  <body>
    <div id="top">
      <span>SCORE: <span id="score">0</span></span
      ><span>BEST: <span id="best">0</span></span
      ><span>LV: <span id="lv">1</span></span>
    </div>
    <canvas id="c"></canvas>
    <div id="overlay">
      <h2>SNAKE</h2>
      <p>ARROW KEYS / WASD</p>
      <p class="hint">Mobile: swipe to move</p>
      <button id="restart">▶ START</button>
    </div>
    <script src="snake.js"></script>
  </body>
</html>
