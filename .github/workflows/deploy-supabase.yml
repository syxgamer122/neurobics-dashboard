# ==============================================================================
# CHU Y THU TU BAT (quan trong, tranh mat du lieu)
#
# Database production duoc dung TAY qua SQL Editor, nen bang so migration
# (supabase_migrations.schema_migrations) ban dau RONG. Neu de workflow tu
# chay `db push` ngay, CLI se coi CA 35 migration la chua ap dung va chay lai
# tu dau — trong do co `drop column` (20260812_security_hardening.sql) va
# `delete from` (20260730020000_signup_security.sql). Do la MAT DU LIEU THAT.
#
#   BUOC 1 (bay gio): chi chay TAY tu tab Actions, GIU O "dry run" DUOC TICH.
#            Log phai bao khong con migration nao cho ap dung.
#   BUOC 2 (sau khi buoc 1 sach): bo comment khoi `push:` ben duoi de moi lan
#            day len main la tu dong deploy.
#
# Truoc BUOC 1 phai chay MOT LAN file supabase/baseline/mark-existing-as-applied.sql
# trong Supabase SQL Editor de chot moc 35 migration da ap dung tay.
# ==============================================================================
name: Deploy Supabase

on:
  # BUOC 2: bo dau # cua 4 dong duoi day SAU KHI dry run da sach.
  # push:
  #   branches: [main]
  #   paths:
  #     - "supabase/migrations/**"
  #     - "supabase/functions/**"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chi in migration se chay, khong ap dung (bo tich moi ap dung that)"
        type: boolean
        default: true

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    name: Push migrations + deploy edge function
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Verify secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Thieu secrets:$missing"
            exit 1
          fi
          echo "Du 3 secrets."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Migration list (truoc khi chay)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: DRY RUN — chi in, khong ap dung
        if: ${{ inputs.dry_run }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: AP DUNG THAT — day migration len database
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Deploy edge function
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy server --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
