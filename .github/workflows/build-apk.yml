name: Build Android APK (Offline Ready)

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build MindGem Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Production Assets
        run: pnpm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindGem-Neurobics-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: MindGem Neurobics Android ${{ github.ref_name }}
          body: |
            ## MindGem Neurobics Offline Android App
            - Đầy đủ 100% tất cả các mini-game nhận thức và Arcade Games.
            - Chạy mượt mà trực tiếp trên máy không cần kết nối mạng.
            - Tự động lưu tiến độ, kỷ lục, điểm số và chuỗi ngày chơi.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
