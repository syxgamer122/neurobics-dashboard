name: Build Android APK (Offline Ready)

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build MindGem Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Production Assets
        run: pnpm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindGem-Neurobics-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: MindGem Neurobics Android ${{ github.ref_name }}
          body: |
            ## MindGem Neurobics Offline Android App
            - ??y ?? 100% t?t c? c?c mini-game nh?n th?c v? Arcade Games.
            - Ch?y m??t m? tr?c ti?p tr?n m?y kh?ng c?n k?t n?i m?ng.
            - T? ??ng l?u ti?n ??, k? l?c, ?i?m s? v? chu?i ng?y ch?i.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
